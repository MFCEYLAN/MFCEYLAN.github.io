name: Build and deploy academic website

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Synchronize publications
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-publications.mjs
      - name: Save publication updates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/publications.auto.json
          git diff --cached --quiet || git commit -m "chore: synchronize publications"
          git push
      - run: python -m pip install -r requirements-cv.txt
      - run: python scripts/generate_cv.py
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
